<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCS Tracker — Group 10 · Prompt Artifacts in LM Psychometrics</title>
<meta name="description" content="Experiment progress tracker for RCS Group 10 — prompt artifacts in LM psychometrics on Twin-2K-500.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/theme-init.js"></script>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <div class="logo" aria-hidden="true">RCS</div>
      <div class="brand-text">
        <h1>RCS Tracker</h1>
        <span class="sub" id="subtitle"></span>
      </div>
    </div>


    <div class="top-actions">
      <time class="synced" id="synced">Syncing…</time>
      <button class="icon-btn" id="refreshBtn" aria-label="Refresh data" title="Refresh data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      </button>
      <a class="icon-btn hide-sm" id="driveBtn" target="_blank" rel="noopener" aria-label="Experiment results (Google Drive)" title="Experiment results">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
      <a class="icon-btn hide-sm" id="repoBtn" target="_blank" rel="noopener" aria-label="GitHub repository" title="GitHub repository">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <button class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<nav class="secnav" aria-label="Sections">
  <div class="wrap" id="secnav">
    <a href="#overview" data-sec="overview">Overview</a>
    <a href="#team" data-sec="team">Team</a>
    <a href="#batches" data-sec="batches">Batches</a>
    <a href="#activity" data-sec="activity">Activity</a>
    <a href="#failures" data-sec="failures">Failures</a>
    <a href="#setup" data-sec="setup">Setup</a>
  </div>
</nav>

<main class="wrap">
  <div id="bannerSlot"></div>

  <section id="overview" aria-labelledby="h-overview">
    <div class="sec-head"><h2 id="h-overview">Overview</h2><span class="hint" id="overviewHint"></span></div>
    <div class="kpis" id="kpis">
      <div class="card kpi"><div class="skel" style="height:14px;width:60%"></div><div class="skel" style="height:28px;width:50%"></div><div class="skel" style="height:6px;margin-top:auto"></div></div>
      <div class="card kpi"><div class="skel" style="height:14px;width:60%"></div><div class="skel" style="height:28px;width:50%"></div><div class="skel" style="height:6px;margin-top:auto"></div></div>
      <div class="card kpi"><div class="skel" style="height:14px;width:60%"></div><div class="skel" style="height:28px;width:30%"></div></div>
      <div class="card kpi"><div class="skel" style="height:14px;width:60%"></div><div class="skel" style="height:28px;width:30%"></div></div>
      <div class="card kpi"><div class="skel" style="height:14px;width:60%"></div><div class="skel" style="height:28px;width:50%"></div></div>
    </div>
    <div class="objs" id="objs">
      <div class="card obj"><div class="skel" style="width:96px;height:96px;border-radius:50%"></div><div style="flex:1;display:grid;gap:8px"><div class="skel" style="height:16px;width:60%"></div><div class="skel" style="height:12px"></div><div class="skel" style="height:12px;width:70%"></div></div></div>
      <div class="card obj"><div class="skel" style="width:96px;height:96px;border-radius:50%"></div><div style="flex:1;display:grid;gap:8px"><div class="skel" style="height:16px;width:60%"></div><div class="skel" style="height:12px"></div><div class="skel" style="height:12px;width:70%"></div></div></div>
      <div class="card obj"><div class="skel" style="width:96px;height:96px;border-radius:50%"></div><div style="flex:1;display:grid;gap:8px"><div class="skel" style="height:16px;width:60%"></div><div class="skel" style="height:12px"></div><div class="skel" style="height:12px;width:70%"></div></div></div>
    </div>
  </section>

  <section id="team" aria-labelledby="h-team">
    <div class="sec-head">
      <h2 id="h-team">Team</h2>
      <div class="toolbar">
        <label class="sr-only" for="search">Search member</label>
        <input type="search" id="search" placeholder="Search member…" autocomplete="off">
      </div>
    </div>
    <div id="teamBody">
      <div class="grid3" style="grid-template-columns:1fr">
        <div class="card mcard"><div class="skel" style="height:40px"></div><div class="skel" style="height:12px"></div><div class="skel" style="height:6px"></div></div>
        <div class="card mcard"><div class="skel" style="height:40px"></div><div class="skel" style="height:12px"></div><div class="skel" style="height:6px"></div></div>
        <div class="card mcard"><div class="skel" style="height:40px"></div><div class="skel" style="height:12px"></div><div class="skel" style="height:6px"></div></div>
      </div>
    </div>
  </section>

  <section id="batches" aria-labelledby="h-batches">
    <div class="sec-head">
      <h2 id="h-batches">Batch board</h2>
      <div class="legend" aria-hidden="true">
        <span class="s-done"><i></i>Done</span><span class="s-running"><i></i>Running</span><span class="s-failed"><i></i>Failed</span><span class="s-stale"><i></i>Stale</span><span class="s-pending"><i style="background:color-mix(in srgb,var(--pending) 35%,var(--surface-2))"></i>Pending</span>
      </div>
    </div>
    <div class="filters" id="statusFilters" role="group" aria-label="Filter batches by status" style="margin-bottom:12px"></div>
    <div class="card board" id="board"><div style="padding:16px;display:grid;gap:10px"><div class="skel" style="height:28px"></div><div class="skel" style="height:28px"></div><div class="skel" style="height:28px"></div></div></div>
  </section>

  <section id="activity" aria-labelledby="h-activity">
    <div class="sec-head"><h2 id="h-activity">Activity</h2><span class="hint">Latest updates from batch runs</span></div>
    <div class="card" id="activityBody"><div style="padding:16px;display:grid;gap:12px"><div class="skel" style="height:32px"></div><div class="skel" style="height:32px"></div></div></div>
  </section>

  <section id="failures" aria-labelledby="h-failures">
    <div class="sec-head"><h2 id="h-failures">Failures &amp; resume</h2><span class="hint">Failed and stalled runs, with the chunk to resume from</span></div>
    <div class="card" id="failBody"><div style="padding:16px"><div class="skel" style="height:80px"></div></div></div>
  </section>

  <section id="setup" aria-labelledby="h-setup">
    <div class="sec-head"><h2 id="h-setup">Setup</h2><span class="hint">Shared tasks for the whole team</span></div>
    <div class="card setup" id="setupBody"><div class="skel" style="height:80px"></div></div>
  </section>
</main>

<footer>
  <div class="wrap" id="footer">Loading…</div>
</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" tabindex="-1">
  <div id="drawerBody"></div>
</aside>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/render.js"></script>
<script src="js/drawer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
